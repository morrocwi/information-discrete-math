[project]
name = "information-discrete-math"
version = "1.3.0"
description = "Readout-first mathematics: the continuum computed as a readout of the discrete."
authors = [{ name = "Yaoharee Lahtee" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["mpmath>=1.3.0", "sympy>=1.12"]

[project.optional-dependencies]
# Retained Spectral — the ready-to-use quantum spectrum product built on IDM.
spectral = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58"]
# Everything needed to reproduce the competition benchmark and redraw its charts.
spectral-bench = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.6",
    "jax>=0.4",
]

[project.urls]
Homepage = "https://github.com/morrocwi/information-discrete-math"

[project.scripts]
idm-serve = "idm.server:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["idm", "retained_spectral", "retained_spectral.competition"]

[tool.setuptools.package-data]
retained_spectral = ["results/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
