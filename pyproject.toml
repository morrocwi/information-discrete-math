[project]
name = "information-discrete-math"
version = "1.4.1"
description = "Readout-first mathematics: the continuum computed as a readout of the discrete."
readme = "README.md"
authors = [{ name = "Yaoharee Lahtee" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "mathematics", "computer-algebra", "cas", "exact-arithmetic", "rational",
    "discrete-mathematics", "readout", "solver", "symbolic", "number-theory",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = ["mpmath>=1.3.0", "sympy>=1.12"]

[project.optional-dependencies]
# Retained Spectral — the ready-to-use quantum spectrum product built on IDM.
spectral = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58"]
# Everything needed to reproduce the competition benchmark and redraw its charts.
spectral-bench = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.6",
    "jax>=0.4",
]

[project.urls]
Homepage = "https://github.com/morrocwi/information-discrete-math"
Repository = "https://github.com/morrocwi/information-discrete-math"
Changelog = "https://github.com/morrocwi/information-discrete-math/blob/main/CHANGELOG.md"
Issues = "https://github.com/morrocwi/information-discrete-math/issues"
Documentation = "https://github.com/morrocwi/information-discrete-math/blob/main/docs/QUICKSTART.md"

[project.scripts]
idm-serve = "idm.server:run"
idm = "idm.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "idm", "idm._solve_domains", "idm.kernel", "idm.kernel.poly",
    "retained_spectral", "retained_spectral.competition",
    # audited helper modules idm re-exports, shipped INSIDE the wheel so `import idm` works from an
    # installed package (not only a source checkout). Reached by bare name via idm/_bridge.py.
    "idm._vendor_tools", "idm._vendor_provefull",
]

[tool.setuptools.package-dir]
# map the vendored subpackages to their source directories without moving the source tree
"idm._vendor_tools" = "tools"
"idm._vendor_provefull" = "provefull"

[tool.setuptools.package-data]
retained_spectral = ["results/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
