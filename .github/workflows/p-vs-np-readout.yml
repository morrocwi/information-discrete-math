name: p-vs-np-readout

on:
  push:
    branches: ["research/p-vs-np-readout"]
    paths:
      - "research/p_vs_np_readout/**"
      - "formal/IDM_SATIntervention.v"
      - "formal/IDM_FutureReadoutWidth.v"
      - "formal/IDM_TransformPotential.v"
      - "formal/IDM_FusionDual.v"
      - "formal/IDM_CircuitGenesisBridge.v"
      - "formal/IDM_RetainRecomputeResolve.v"
      - "formal/IDM_CircuitLedgerTransfer.v"
      - "formal/IDM_RRRCostLowerBound.v"
      - "formal/IDM_DemandCircuitDominance.v"
      - "formal/IDM_ReadoutUniverseAccessibleCompletion.v"
      - "formal/IDM_FreeRereadGuard.v"
      - "formal/verify_p_vs_np.sh"
      - ".github/workflows/p-vs-np-readout.yml"
  pull_request:
    paths:
      - "research/p_vs_np_readout/**"
      - "formal/IDM_SATIntervention.v"
      - "formal/IDM_FutureReadoutWidth.v"
      - "formal/IDM_TransformPotential.v"
      - "formal/IDM_FusionDual.v"
      - "formal/IDM_CircuitGenesisBridge.v"
      - "formal/IDM_RetainRecomputeResolve.v"
      - "formal/IDM_CircuitLedgerTransfer.v"
      - "formal/IDM_RRRCostLowerBound.v"
      - "formal/IDM_DemandCircuitDominance.v"
      - "formal/IDM_ReadoutUniverseAccessibleCompletion.v"
      - "formal/IDM_FreeRereadGuard.v"
      - "formal/verify_p_vs_np.sh"
      - ".github/workflows/p-vs-np-readout.yml"

jobs:
  finite-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install IDM runtime dependencies
        run: python3 -m pip install -e .
      - name: intervention signature exact fixture
        run: python3 research/p_vs_np_readout/sat_intervention_quotient.py --max-m 10
      - name: future-readout residual-width exact fixture
        run: python3 research/p_vs_np_readout/future_readout_width.py --max-m 6
      - name: transform-potential exhaustive negative control
        run: python3 research/p_vs_np_readout/transform_potential_audit.py
      - name: exact fusion-Horn cover diagnostic
        run: python3 research/p_vs_np_readout/fusion_horn_exact.py
      - name: exact fusion-cover LP dual certificate
        run: python3 research/p_vs_np_readout/fusion_dual_certificate.py
      - name: circuit-lineage to fusion exact diagnostic
        run: python3 research/p_vs_np_readout/circuit_lineage_fusion_diagnostic.py
      - name: RRR equality sharing negative control
        run: python3 research/p_vs_np_readout/rrr_circuit_audit.py
      - name: Readout-Universe accessible-completion fixture
        run: python3 research/p_vs_np_readout/readout_universe_sat_completion.py
      - name: static semantic-capacity exact audit
        run: python3 research/p_vs_np_readout/semantic_capacity_audit.py
      - name: weak-rank exact finite fixture
        run: python3 research/p_vs_np_readout/weak_rank_principle.py
      - name: recomputation pebbling exact finite fixture
        run: python3 research/p_vs_np_readout/pebbling_readout_frontier.py
      - name: earlier SAT collision fixture
        run: python3 research/p_vs_np_readout/readout_sat_frontier.py
      - name: AC0 reduction baseline
        run: python3 research/p_vs_np_readout/parity_to_cnf_baseline.py

  coq-intervention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: "8.20"
          ocaml_version: "default"
          custom_script: |
            startGroup "verify P-vs-NP readout witnesses"
              sudo chown -R "$(whoami)" .
              bash formal/verify_p_vs_np.sh
            endGroup
