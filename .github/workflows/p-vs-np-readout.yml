name: p-vs-np-readout

on:
  push:
    branches: ["research/p-vs-np-readout"]
    paths:
      - "research/p_vs_np_readout/**"
      - "formal/IDM_SATIntervention.v"
      - "formal/IDM_FutureReadoutWidth.v"
      - "formal/verify_p_vs_np.sh"
      - ".github/workflows/p-vs-np-readout.yml"
  pull_request:
    paths:
      - "research/p_vs_np_readout/**"
      - "formal/IDM_SATIntervention.v"
      - "formal/IDM_FutureReadoutWidth.v"
      - "formal/verify_p_vs_np.sh"
      - ".github/workflows/p-vs-np-readout.yml"

jobs:
  finite-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: intervention signature exact fixture
        run: python3 research/p_vs_np_readout/sat_intervention_quotient.py --max-m 10
      - name: future-readout residual-width exact fixture
        run: python3 research/p_vs_np_readout/future_readout_width.py --max-m 6
      - name: weak-rank exact finite fixture
        run: python3 research/p_vs_np_readout/weak_rank_principle.py
      - name: recomputation pebbling exact finite fixture
        run: python3 research/p_vs_np_readout/pebbling_readout_frontier.py
      - name: earlier SAT collision fixture
        run: python3 research/p_vs_np_readout/readout_sat_frontier.py
      - name: AC0 reduction baseline
        run: python3 research/p_vs_np_readout/parity_to_cnf_baseline.py

  coq-intervention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: "8.20"
          ocaml_version: "default"
          custom_script: |
            startGroup "verify P-vs-NP readout witnesses"
              sudo chown -R "$(whoami)" .
              bash formal/verify_p_vs_np.sh
            endGroup
