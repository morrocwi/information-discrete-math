name: Clay Research Governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clay-governance:
    name: clay-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fail-closed governance gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/clay_governance_gate.py "$BASE_SHA" "$HEAD_SHA"
