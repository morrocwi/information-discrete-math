name: verify
on: [push, pull_request]
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: prove_it_lite (ZERO dependencies — stdlib only)
        run: python3 prove_it_lite.py
      - run: pip install -r requirements.txt pytest
      - name: prove_it (run-don't-trust, 40-digit)
        run: python3 prove_it.py
      - name: prove_it_full (1278 problems, 5 domains)
        run: python3 prove_it_full.py
      - name: tool self-checks
        run: python3 tools/idm_tools.py && python3 tools/idm_discipline.py && python3 tools/framework_compliance.py && python3 tools/certified_readout.py && python3 tools/aggregate.py && python3 tools/eng_readouts.py
      - name: RCP self-checks (retained contraction / energy — pure finite)
        run: python3 tools/retained_contraction_protocol.py && python3 tools/retained_burden_algebra.py && python3 tools/retained_energy_protocol.py && python3 validation/rcp_energy_selfcheck.py
      - name: RCP energy + N-D work-token benchmarks (reproduce the savings)
        run: python3 benchmarks/rcp_energy_challenge.py && python3 benchmarks/direct_nd_work_tokens.py --dimension 9 --nodes-per-axis 5
      - name: validations
        run: for f in validation/*.py; do echo "== $f =="; python3 "$f" || exit 1; done
      - name: pytest
        # Single-process run: the migration byte-identity gate is order-independent again now that
        # idm.solve dispatches every kind under a fixed mp.workdps(_CANON_DPS) — a numeric readout no
        # longer inherits whatever ambient mpmath precision a sibling module/test left, so a
        # dps-sensitive kind (E1) cannot flake by test order.
        run: pytest -q
  coq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Coq 8.20 — the version every witness is written and verified against (see the file
      # headers and the README badge). Ubuntu's `apt install coq` ships 8.18, on which two of the
      # pre-existing witnesses do not compile; the axiom-free claim is a claim *about 8.20*, so CI
      # must verify on 8.20. docker-coq-action pulls a prebuilt coqorg/coq:8.20 image.
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.20'
          ocaml_version: 'default'
          custom_script: |
            startGroup "verify formal core (compile every witness + Print Assumptions axiom-free)"
              sudo chown -R "$(whoami)" .
              bash formal/verify.sh
            endGroup
