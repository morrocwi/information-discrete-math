name: verify
on: [push, pull_request]
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pytest
      - name: prove_it (run-don't-trust)
        run: python3 prove_it.py
      - name: tool self-checks
        run: python3 tools/idm_tools.py && python3 tools/idm_discipline.py && python3 tools/framework_compliance.py
      - name: validations
        run: for f in validation/*.py; do echo "== $f =="; python3 "$f" || exit 1; done
      - name: pytest
        run: pytest -q
